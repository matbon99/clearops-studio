<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WOT Boost Lab — Grazie</title>
  <style>
    :root{--bg:#0b0f1a;--card:#121a2b;--text:#e8eefc;--muted:#a9b6d6;--border:rgba(255,255,255,.10);--r:16px;}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
    .wrap{max-width:860px;margin:0 auto;padding:24px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin:14px 0}
    h1,h2{margin:0 0 10px}
    p{margin:0 0 12px;color:var(--muted)}
    .btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.06);color:var(--text);cursor:pointer;font-weight:800;text-decoration:none}
    .btn.primary{border:none;background:linear-gradient(135deg,#6ea8fe,#9a7bff);color:#0b0f1a}
    .small{font-size:13px;color:var(--muted)}
    .ok{padding:12px;border-radius:12px;border:1px solid rgba(126,231,135,.35);background:rgba(126,231,135,.08);color:var(--muted)}
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Grazie! ✅</h1>
    <p>Abbiamo ricevuto la richiesta. Ti rispondiamo via email per confermare e fissare sessione.</p>
    <div class="ok"><b>Next step:</b> controlla email (anche spam) per il primo contatto.</div>
  </div>

  <div class="card">
    <h2>Riepilogo</h2>
    <p class="small">ID ordine: <span id="pid"></span></p>
    <p class="small"><a class="btn" href="index.html">Torna alla home</a></p>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  document.getElementById("pid").textContent = params.get("p") || "-";
</script>
</body>
</html>
