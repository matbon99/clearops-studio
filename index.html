<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClearOps Studio — Ordine servizi</title>

<style>
body{
  margin:0;
  font-family:system-ui, sans-serif;
  background:#0b0f1a;
  color:#e8eefc;
}
.wrap{max-width:900px;margin:auto;padding:24px}
.card{
  background:#121a2b;
  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
}
h1,h2,h3{margin-top:0}
.btn{
  padding:12px 16px;
  border-radius:12px;
  border:none;
  cursor:pointer;
  background:#6ea8fe;
  color:#000;
  font-weight:600;
}
input,textarea,select{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:none;
  margin-top:6px;
  margin-bottom:12px;
}
textarea{min-height:140px}
.hidden{display:none}
.small{font-size:13px;color:#a9b6d6}
</style>
</head>

<body>
<div class="wrap">

<h1>Ordina il tuo servizio</h1>
<p class="small">Inserisci prima le informazioni, poi procedi al pagamento.</p>

<!-- SCELTA PRODOTTO -->
<div class="card">
<h2>Scegli prodotto</h2>
<select id="prodotto" onchange="selectProduct()" required>
  <option value="">Seleziona…</option>
  <option value="TR-29">Traduzione 1 pagina — €29</option>
  <option value="RW-39">Riscrittura 1 pagina — €39</option>
</select>
</div>

<!-- FORM -->
<div class="card hidden" id="orderForm">
<h2>Inserisci le informazioni</h2>

<form id="form"
 action="https://formspree.io/f/xaqnrdae"
 method="POST"
 enctype="multipart/form-data">

<input type="hidden" name="prodotto" id="prodottoField">
<input type="hidden" name="_subject" value="Nuovo ordine — ClearOps Studio">

<label>Nome</label>
<input name="nome" required>

<label>Email</label>
<input type="email" name="email" required>

<label>Testo o istruzioni</label>
<textarea name="contenuto" placeholder="Incolla qui il testo oppure spiega cosa vuoi ottenere…" required></textarea>

<label>Carica file (opzionale)</label>
<input type="file" name="file">

<label>Note aggiuntive</label>
<textarea name="note" placeholder="Tono, lingua, obiettivo, scadenza…"></textarea>

<button class="btn" type="submit">Vai al pagamento</button>
</form>

<p class="small">
Dopo l’invio verrai reindirizzato a PayPal per completare il pagamento.
</p>
</div>

</div>

<script>
const PAYPAL = {
  "TR-29": "https://www.paypal.com/ncp/payment/PJ5NPKYTZCXHA",
  "RW-39": "https://www.paypal.com/ncp/payment/26P3TXNXD2PCE"
};

function selectProduct(){
  const p = document.getElementById("prodotto").value;
  if(!p) return;
  document.getElementById("orderForm").classList.remove("hidden");
  document.getElementById("prodottoField").value = p;
}

document.getElementById("form").addEventListener("submit", async function(e){
  e.preventDefault();
  const form = e.target;
  const data = new FormData(form);

  const res = await fetch(form.action, {
    method:"POST",
    body:data,
    headers:{ "Accept":"application/json" }
  });

  if(res.ok){
    const prodotto = document.getElementById("prodottoField").value;
    window.location.href = PAYPAL[prodotto];
  }else{
    alert("Errore invio dati. Riprova.");
  }
});
</script>

</body>
</html>
